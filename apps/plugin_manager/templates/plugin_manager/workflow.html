{% load static %}

    <div class="plugin-store-heading">
        <h1 id="plugin-workflow-title">{{ record.name|default:record.plugin_id }}</h1>
        <p><a href="{% url 'plugin_manager:plugin_list' %}" hx-get="{% url 'plugin_manager:plugin_list' %}" hx-target="#content-container" hx-swap="outerHTML" hx-push-url="true">Back to Plugins</a></p>

    {% include 'plugin_manager/editor_panels.html' %}
