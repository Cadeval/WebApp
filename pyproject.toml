[project]
name = "cadevil-webapp"
version = "0.16.0"
description = "IFC building assessment, material passports and signed workflow plugins"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46",
    "pyjwt>=2.15.1,<3",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "django-bolt[mcp]==0.11.1",
    "ifcopenshell>=0.8.5",
    # IfcOpenShell EXPRESS validation imports _pytest.assertion at runtime.
    "pytest>=8.4",
    "plotly==7.0.0",
    "watchdog>=6.0.0",
    "ifccityjson==0.8.5",
    "pyproj>=3.7,<4",
    "jsonschema>=4.26,<5",
    "httpx>=0.28,<1",
    "shapely>=2.1,<3",
    "pillow>=12.3,<13",
    "psycopg[binary]>=3.3.6,<4",
    "redis>=7,<8",
]

[dependency-groups]
dev = ["django-stubs>=6.1.0", "pyrefly==1.3.0"]

[project.entry-points."cadevil.plugins"]
"cadevil.example.editor" = "plugins.example_plugin:plugin_manifest"
"cadevil.rust-example.editor" = "plugins.rust_example_plugin:plugin_manifest"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

# The hook supplies exact files from docker/image-files.json. Default filesystem
# discovery remains disabled for both distributable formats.
[tool.hatch.build]
exclude = ["**"]
ignore-vcs = true

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
bypass-selection = true
dev-mode-dirs = ["."]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
