[project]
name = "cadevil-webapp"
version = "0.10.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pytest>=8.4",
    "channels>=4.3.2",
    "daphne>=4.2.3",
    "django-bolt[mcp]==0.11.1",
    "django-htmx>=1.29.0",
    "django-stubs>=6.1.0",
    "ifcopenshell>=0.8.5",
    "plotly==7.0.0",
    "pyrefly==1.3.0",
    "types-channels>=4.3.0.20260518",
    "watchdog>=6.0.0",
    "ifccityjson==0.8.5",
    "pyproj>=3.7,<4",
    "jsonschema>=4.26,<5",
    "httpx>=0.28,<1",
    "shapely>=2.1,<3",
    "pillow>=12.3,<13",
]

[project.entry-points."cadevil.plugins"]
"cadevil.example.editor" = "example_plugin:plugin_manifest"
"cadevil.rust-example.editor" = "rust_example_plugin:plugin_manifest"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
